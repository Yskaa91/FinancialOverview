name: Financial Overview
version: "0.7.4"
slug: financial_overview
description: Track wealth, income and expenses from ASN, PayPal and ICS statements
url: https://github.com/Yskaa91/FinancialOverview
# Prebuilt image, published by .github/workflows/build-addon-image.yml. With an
# `image:` here the Supervisor pulls the tag matching `version` instead of
# building the app on the Home Assistant host, which is the difference between a
# one-minute update and a fifteen-minute one.
image: ghcr.io/yskaa91/financial-overview-{arch}
arch:
  - amd64
startup: application
boot: auto
init: false
backup: cold
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: Web interface
watchdog: http://[HOST]:[PORT:3000]/
# Opened inside Home Assistant: the ingress iframe under /api/hassio_ingress/,
# reached on the internal network, so nothing has to be exposed. `panel_admin:
# false` lets other household accounts open it; the app still has its own
# password. `ports` stays, so the app is also reachable directly on the LAN.
ingress: true
ingress_port: 3000
panel_icon: mdi:finance
panel_title: Financial Overview
panel_admin: false
options:
  access_password: ""
  ai_provider: none
  ai_api_key: ""
  ai_model: mistral-small-latest
  ai_max_batches: 5
  min_hits_for_rule: 3
  price_fetch: disabled
schema:
  access_password: password
  ai_provider: list(none|mistral)
  ai_api_key: password
  ai_model: str
  ai_max_batches: int(1,50)
  min_hits_for_rule: int(1,20)
  price_fetch: list(disabled|yahoo|stooq)
